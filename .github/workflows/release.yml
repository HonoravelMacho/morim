name: "Lançamento Morim"

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "ubuntu-22.04"
            args: ""
          - platform: "windows-latest"
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Build com Tauri Action
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.TAURI_GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: "Morim v__VERSION__"
          releaseBody: "Release multi-plataforma do Morim: Linux (.deb, .rpm, .tar.gz) + Windows (instalador NSIS .exe)."
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

      - name: Criar .tar.gz (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.TAURI_GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          BIN="src-tauri/target/release/morim"
          if [ ! -x "$BIN" ]; then
            echo "Binário não encontrado em $BIN"
            ls -la src-tauri/target/release/
            exit 1
          fi
          STAGE="morim-${TAG}-linux-x64"
          rm -rf "$STAGE" "${STAGE}.tar.gz"
          mkdir -p "$STAGE"
          cp "$BIN" "$STAGE/"
          tar -czf "${STAGE}.tar.gz" "$STAGE"
          gh release upload "$TAG" "${STAGE}.tar.gz" --clobber
